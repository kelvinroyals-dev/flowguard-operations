<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlowGuard — Sign In</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="favicon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#111214; --card:#1c1d20; --field:#141518;
      --line:#34363b; --line-2:#3d4046;
      --t1:#f0f1f2; --t2:#b5b8be; --t3:#8b909a; --t4:#6c727c;
      --blue:#5379ff; --blue-h:#3f63e6;
      --err:#f0616d; --err-bg:rgba(240,97,109,.12);
      --ff:'Inter',system-ui,sans-serif; --ff-m:'JetBrains Mono',monospace;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--t1);font-family:var(--ff);-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 20px}
    body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(900px 500px at 50% -10%,rgba(83,121,255,.06),transparent 60%)}

    .shell{position:relative;z-index:2;width:100%;max-width:520px;display:flex;flex-direction:column;align-items:center}

    /* brand */
    .brand{display:flex;align-items:center;gap:14px;margin-bottom:26px}
    .brand-logo{width:52px;height:52px;border-radius:13px;background:#1c1d20;border:1px solid var(--line-2);display:grid;place-items:center}
    .brand-logo img{width:30px;height:30px;object-fit:contain}
    .brand-txt .n{font-size:26px;font-weight:700;letter-spacing:-.01em;line-height:1;color:var(--t1)}
    .brand-txt .t{font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--t3);margin-top:5px}

    /* card */
    .card{width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:36px 40px 40px}
    h1{font-size:38px;font-weight:700;letter-spacing:-.02em;line-height:1.05;color:var(--t1)}
    .sub{color:var(--t2);font-size:15px;margin:8px 0 30px}

    .field{margin-bottom:20px}
    .field label{display:block;font-size:14px;font-weight:600;color:var(--t1);margin-bottom:9px}
    .inp-wrap{position:relative;display:flex;align-items:center}
    .inp-wrap .lead{position:absolute;left:15px;color:var(--t3);display:grid;place-items:center;pointer-events:none}
    .inp-wrap .lead svg{width:18px;height:18px}
    .field-inp{width:100%;padding:14px 16px 14px 46px;background:var(--field);border:1px solid var(--line-2);border-radius:10px;color:var(--t1);font-family:inherit;font-size:15px;transition:.15s}
    .field-inp::placeholder{color:var(--t4)}
    .field-inp:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(83,121,255,.18)}
    .pw-tog{position:absolute;right:10px;background:none;border:none;color:var(--t3);cursor:pointer;padding:9px;display:grid;place-items:center}
    .pw-tog:hover{color:var(--t1)}

    .row{display:flex;align-items:center;justify-content:space-between;margin:4px 0 26px}
    .chk{display:flex;align-items:center;gap:10px;font-size:14.5px;color:var(--t2);cursor:pointer;user-select:none}
    .chk-box{width:18px;height:18px;accent-color:var(--blue);cursor:pointer}
    .link{color:var(--blue);font-size:14.5px;font-weight:500;text-decoration:none}
    .link:hover{text-decoration:underline}

    .btn-submit{width:100%;padding:15px;border-radius:11px;background:var(--blue);color:#fff;border:none;font-family:inherit;font-size:16px;font-weight:600;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center;gap:9px}
    .btn-submit:hover:not(:disabled){background:var(--blue-h)}
    .btn-submit:disabled{opacity:.75;cursor:default}
    .spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
    @keyframes spin{to{transform:rotate(360deg)}}

    .msg{display:none;align-items:flex-start;gap:9px;margin-top:16px;padding:12px 14px;border-radius:10px;font-size:14px;line-height:1.45}
    .msg.error{display:flex;background:var(--err-bg);color:#f4959d;border:1px solid rgba(240,97,109,.3)}

    .foot{margin-top:26px;font-family:var(--ff-m);font-size:12px;color:var(--t4);text-align:center}
    .foot b{color:var(--t3);font-weight:500}

    /* loading screen */
    .loadscreen{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center}
    .loadscreen.show{display:flex}
    .loadscreen .brand{margin-bottom:34px;flex-direction:column;gap:12px}
    .loadscreen .brand-txt{text-align:center}
    .loadscreen h2{font-size:34px;font-weight:700;letter-spacing:-.02em;color:var(--t1)}
    .loadscreen p{color:var(--t2);font-size:16px;margin-top:10px}
    .progress{width:min(480px,80vw);height:6px;border-radius:4px;background:#26282c;overflow:hidden;margin-top:34px}
    .progress > span{display:block;height:100%;width:30%;border-radius:4px;background:var(--blue);animation:slide 1.1s ease-in-out infinite}
    @keyframes slide{0%{margin-left:-30%}100%{margin-left:100%}}
    .loadscreen .foot{position:fixed;bottom:34px;left:0;right:0}

    @media(max-width:520px){.card{padding:28px 22px 30px}h1{font-size:30px}.brand-txt .n{font-size:22px}}
  </style>
</head>
<body>
  <div class="shell">
    <div class="brand">
      <div class="brand-logo"><img src="fg-logo-dark.png" alt="FlowGuard"></div>
      <div class="brand-txt">
        <div class="n">FlowGuard</div>
        <div class="t">Neon Center</div>
      </div>
    </div>

    <div class="card">
      <h1>Sign in</h1>
      <p class="sub">Access your FlowGuard workspace.</p>

      <form id="lform" novalidate>
        <div class="field">
          <label for="email">Email address</label>
          <div class="inp-wrap">
            <span class="lead"><svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></span>
            <input type="email" id="email" class="field-inp" placeholder="you@company.com" autocomplete="email" required>
          </div>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="inp-wrap">
            <span class="lead"><svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 118 0v4"/></svg></span>
            <input type="password" id="password" class="field-inp" placeholder="Enter your password" autocomplete="current-password" required>
            <button type="button" class="pw-tog" id="pwtog" aria-label="Show password">
              <svg id="eye-svg" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="row">
          <label class="chk"><input type="checkbox" id="remme" class="chk-box"> Keep me signed in</label>
          <a class="link" href="forgot-password.html">Forgot password?</a>
        </div>

        <button type="submit" class="btn-submit" id="sbtn"><span class="btn-text">Sign in</span></button>

        <div class="msg" id="fmsg" role="alert" aria-live="assertive">
          <span id="fmsg-text"></span>
        </div>
      </form>
    </div>

    <div class="foot"><b>FlowGuard Solutions</b> &nbsp;|&nbsp; © 2026</div>
  </div>

  <!-- post-sign-in loading screen -->
  <div class="loadscreen" id="loadscreen">
    <div class="brand">
      <div class="brand-logo"><img src="fg-logo-dark.png" alt="FlowGuard"></div>
      <div class="brand-txt">
        <div class="n">FlowGuard</div>
        <div class="t">Neon Center</div>
      </div>
    </div>
    <h2>Loading your workspace…</h2>
    <p>Preparing your access and workspace.</p>
    <div class="progress"><span></span></div>
    <div class="foot"><b>FlowGuard Solutions</b> &nbsp;|&nbsp; © 2026</div>
  </div>

<script>
  // password visibility toggle
  document.getElementById('pwtog').addEventListener('click', function () {
    var inp = document.getElementById('password');
    var eye = document.getElementById('eye-svg');
    if (inp.type === 'password') {
      inp.type = 'text';
      eye.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0112 20c-6.5 0-10-7-10-7a17.6 17.6 0 015.06-5.94M9.9 4.24A9.1 9.1 0 0112 4c6.5 0 10 7 10 7a17.6 17.6 0 01-2.16 3.19M1 1l22 22"/>';
    } else {
      inp.type = 'password';
      eye.innerHTML = '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>';
    }
  });

  function showMsg(txt, type) {
    var box = document.getElementById('fmsg');
    box.className = 'msg ' + (type || 'error');
    document.getElementById('fmsg-text').textContent = txt;
  }
  function clearMsg() { document.getElementById('fmsg').className = 'msg'; }

  document.getElementById('lform').addEventListener('submit', async function (e) {
    e.preventDefault(); clearMsg();
    var email    = document.getElementById('email').value.trim();
    var password = document.getElementById('password').value;
    var remember = document.getElementById('remme').checked;
    var btn  = document.getElementById('sbtn');
    var btxt = btn.querySelector('.btn-text');
    if (!email || !password) { showMsg('Please enter your email and password.'); return; }
    btn.disabled = true;
    btxt.innerHTML = '<span class="spinner"></span>Signing in…';
    try {
      var r = await fetch('https://api.flowguard.ng/api/v1/auth/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, password: password, portal: 'ops' })
      });
      var d = await r.json();
      if (d.success) {
        if (d.data.user.user_type !== 'internal') {
          btn.disabled = false; btxt.textContent = 'Sign in';
          showMsg('Invalid credentials. Please try again.'); return;
        }
        var store = remember ? localStorage : sessionStorage;
        store.setItem('token', d.data.token);
        store.setItem('user', JSON.stringify(d.data.user));
        if (!remember) { localStorage.removeItem('token'); localStorage.removeItem('user'); }
        var role = String(d.data.user.role || '').trim().toLowerCase().replace(/[\s-]+/g, '_');
        var dest = role === 'field_team' ? 'field.html' : 'index.html';
        document.getElementById('loadscreen').classList.add('show');  // show loading screen
        setTimeout(function () { window.location.href = dest; }, 1400);
      } else {
        btn.disabled = false; btxt.textContent = 'Sign in';
        showMsg(d.error || 'Invalid credentials. Please try again.');
      }
    } catch (err) {
      btn.disabled = false; btxt.textContent = 'Sign in';
      showMsg('Connection failed. Check your network and retry.');
    }
  });
</script>
</body>
</html>
